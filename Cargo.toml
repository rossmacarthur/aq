[package]
name = "aq-cli"
version = "0.5.1"
authors = ["Ross MacArthur <ross@macarthur.io>"]
edition = "2021"
rust-version = "1.80.0"
description = "Extend jq for any data format"
readme = "README.md"
repository = "https://github.com/rossmacarthur/aq"
license = "MIT OR Apache-2.0"
keywords = ["cli", "json", "toml", "yaml", "query"]
categories = ["command-line-utilities"]
autotests = false

[dependencies]
anyhow = "1.0.69"
serde = "1.0.152"
serde_json = "1.0.93"
serde-transcode = "1.1.1"
toml = "1.1.2"
yaml_serde = "0.10.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[profile.release]
strip = true

[[bin]]
name = "aq"
path = "src/main.rs"

[[test]]
name = "smoke"
path = "tests/smoke.rs"
