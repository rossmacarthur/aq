name: build

on: [push, pull_request]

env:
  BIN: aq

jobs:
  # ---------------------------------------------------------------------------
  # Build
  # ---------------------------------------------------------------------------

  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        toolchain: [stable, beta, nightly]

    env:
      RUSTFLAGS: --deny warnings

    steps:
    - uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.toolchain }}
        components: rustfmt, clippy

    - name: Rustfmt
      run: cargo fmt -- --check

    - name: Clippy
      run: cargo clippy --workspace --all-targets

  # ---------------------------------------------------------------------------
  # Check version against tag
  # ---------------------------------------------------------------------------

  check-version:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Calculate version from tag
        id: version
        run: echo "value=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Check tag against package version
        run: grep '^version = "${{ steps.version.outputs.value }}"$' Cargo.toml

  # ---------------------------------------------------------------------------
  # Publish to Crates.io
  # ---------------------------------------------------------------------------

  publish:
    needs: check-version
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable

    - uses: rust-lang/crates-io-auth-action@v1
      id: auth

    - name: Publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      run: cargo publish

  # ---------------------------------------------------------------------------
  # Release to GitHub
  # ---------------------------------------------------------------------------

  release:
    needs: check-version

    strategy:
      matrix:
        include:
        - { os: macos-latest, target: aarch64-apple-darwin }
        - { os: macos-latest, target: x86_64-apple-darwin }
        - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, cross: true }
        - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, cross: true }
        - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, cross: true }
        - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, cross: true }
        - { os: windows-latest, target: x86_64-pc-windows-msvc }

    name: release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Calculate version from tag
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build
        shell: bash
        run: |
          CARGO=cargo
          if [ "${{ matrix.cross }}" == "true" ]; then
            cargo install cross --git https://github.com/cross-rs/cross --locked
            CARGO=cross
          fi
          $CARGO build --bin $BIN --locked --release --target ${{ matrix.target }}

      - name: Archive
        id: archive
        shell: bash
        run: |
          mkdir release

          cp LICENSE* release
          cp README.md release

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/$BIN.exe release
            archive=$BIN-${{ steps.version.outputs.value }}-${{ matrix.target }}.zip
            7z a $archive release
          else
            cp target/${{ matrix.target }}/release/$BIN release
            archive=$BIN-${{ steps.version.outputs.value }}-${{ matrix.target }}.tar.gz
            cd release
            tar cfz "../$archive" -- *
            cd ..
          fi

          rm -r release
          echo "path=$archive" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ steps.archive.outputs.path }}
